name: Secret Scan

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configuration:
    name: Secret Scan Configuration
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check verifier credential
        id: check
        env:
          SECURITY_SETTINGS_TOKEN: ${{ secrets.SECURITY_SETTINGS_TOKEN }}
        shell: bash
        run: |
          if [[ -n "${SECURITY_SETTINGS_TOKEN}" ]]; then
            echo "configured=true" >> "${GITHUB_OUTPUT}"
          else
            echo "configured=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Secret Scan is NO RESULT until SECURITY_SETTINGS_TOKEN is configured."
          fi

  secret-scan:
    name: Secret Scan
    needs: configuration
    if: ${{ needs.configuration.outputs.configured == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.SECURITY_SETTINGS_TOKEN }}
      REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Verify GitHub Secret Scanning and push protection
        shell: bash
        run: |
          set -u
          settings_file="${RUNNER_TEMP}/security-settings.json"
          status="failed"
          reason="GitHub security settings could not be read."
          if gh api "repos/${GITHUB_REPOSITORY}" >"${settings_file}" 2>"${RUNNER_TEMP}/security-settings-error"; then
            secret_status="$(jq -r '.security_and_analysis.secret_scanning.status // empty' "${settings_file}")"
            push_status="$(jq -r '.security_and_analysis.secret_scanning_push_protection.status // empty' "${settings_file}")"
            if [[ -z "${secret_status}" || -z "${push_status}" ]]; then
              status="not_run"
              reason="GitHub returned no security-setting status; SECURITY_SETTINGS_TOKEN needs repository security-settings read access."
            elif [[ "${secret_status}" == "enabled" && "${push_status}" == "enabled" ]]; then
              alerts_file="${RUNNER_TEMP}/secret-alerts.json"
              if gh api "repos/${GITHUB_REPOSITORY}/secret-scanning/alerts?state=open&per_page=100" >"${alerts_file}" 2>"${RUNNER_TEMP}/secret-alerts-error"; then
                open_alerts="$(jq 'length' "${alerts_file}")"
                if [[ "${open_alerts}" == "0" ]]; then
                  status="passed"
                  reason="GitHub Secret Scanning and push protection are enabled; no open secret alerts were reported."
                else
                  reason="GitHub Secret Scanning reported ${open_alerts} open secret alert(s)."
                fi
              else
                reason="Secret scanning alerts could not be read: $(tr '\n' ' ' <"${RUNNER_TEMP}/secret-alerts-error")"
              fi
            elif [[ "${secret_status}" == "disabled" || "${push_status}" == "disabled" ]]; then
              reason="Secret Scanning=${secret_status}; push protection=${push_status}."
            else
              status="not_run"
              reason="GitHub returned unexpected security-setting status values: Secret Scanning=${secret_status}; push protection=${push_status}."
            fi
          else
            reason="$(tr '\n' ' ' <"${RUNNER_TEMP}/security-settings-error")"
          fi

          mkdir -p .artifacts/guardrails/evidence
          STATUS="${status}" REASON="${reason}" REVISION="${REVISION}" python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          status = os.environ["STATUS"]
          evidence = {
              "version": 1,
              "subject": {"type": "git-commit", "revision": os.environ["REVISION"]},
              "checks": {
                  "secrets-scan": {
                      "producer": "GitHub Secret Scanning and push protection settings",
                      "status": status,
                      "evidence": [os.environ["REASON"]],
                  }
              },
          }
          Path(".artifacts/guardrails/evidence/secrets-scan.json").write_text(
              json.dumps(evidence, indent=2) + "\n", encoding="utf-8"
          )
          PY
          [[ "${status}" == "passed" ]]

  organization-scanner:
    name: Secret Scan / organization scanner
    if: ${{ vars.SECRET_SCAN_COMMAND != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SECRET_SCAN_COMMAND: ${{ vars.SECRET_SCAN_COMMAND }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Run organization secret scanner
        shell: bash
        run: bash -euo pipefail -c "${SECRET_SCAN_COMMAND}"

# This workflow uses pull_request_target so the token is supplied only to this
# trusted, no-checkout verifier; never move the token into a workflow that
# executes PR-controlled code. SECURITY_SETTINGS_TOKEN must be a narrowly
# scoped GitHub App or fine-grained token that can read repository security
# settings and secret-scanning alerts. Without it the verifier is skipped and
# the scorecard reports NO RESULT; it never guesses.
