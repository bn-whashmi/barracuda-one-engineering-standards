name: Artifact Provenance

on:
  workflow_call:
    inputs:
      artifact-path:
        description: Path or glob for the built artifact to attest.
        required: true
        type: string
      build-command:
        description: Optional command that creates the artifact before attestation.
        required: false
        type: string
        default: ''
      working-directory:
        description: Directory in which the build command runs.
        required: false
        type: string
        default: '.'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  attest:
    name: Artifact Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Artifact attestations record github.sha. On pull_request this is
          # the synthetic merge revision, so attest that exact source tree.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Build artifact
        if: ${{ inputs.build-command != '' }}
        working-directory: ${{ inputs.working-directory }}
        shell: bash
        run: bash -euo pipefail -c "${{ inputs.build-command }}"

      - name: Verify artifact exists
        shell: bash
        env:
          ARTIFACT_PATH: ${{ inputs.artifact-path }}
        run: |
          set -euo pipefail
          compgen -G "${ARTIFACT_PATH}" >/dev/null || {
            echo "No artifact matched ARTIFACT_PATH=${ARTIFACT_PATH}" >&2
            exit 1
          }

      - name: Generate artifact attestation
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: ${{ inputs.artifact-path }}

      - name: Verify attestation contract
        run: |
          echo "Artifact provenance attestation created for: ${{ inputs.artifact-path }}"
          echo "Verify later with: gh attestation verify <artifact> --repo <owner>/<repository>"
